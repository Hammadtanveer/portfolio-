<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" preserveAspectRatio="none">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="rgba(255,255,255,0)" />
      <path d="M 0 0 L 40 0" stroke="#0A0A0A" stroke-opacity="0.06" stroke-width="1" />
      <path d="M 0 0 L 0 40" stroke="#0A0A0A" stroke-opacity="0.06" stroke-width="1" />
      <!-- darker thicker lines every 5 cells -->
      <path d="M 0 0 L 40 0" transform="translate(0,20)" stroke="#0A0A0A" stroke-opacity="0.03" stroke-width="1" />
      <path d="M 0 0 L 0 40" transform="translate(20,0)" stroke="#0A0A0A" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
</svg>
